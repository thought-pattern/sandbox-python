name: Static Analysis

on:
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "pytest.ini"
      - "container/requirements.txt"
      - "container/Containerfile"
      - "container/workspace.proto"
      - ".github/workflows/static-analysis.yml"
  push:
    branches: [develop, main]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "pytest.ini"
      - "container/requirements.txt"
      - "container/Containerfile"
      - "container/workspace.proto"
      - ".github/workflows/static-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-security:
    name: Lint and Security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: python -m pip install --upgrade bandit isort ruff vulture

      - name: Import-order check
        run: isort --check-only container tests

      - name: Run Ruff
        run: ruff check container tests

      - name: Bytecode compilation check
        run: python -m compileall -q container tests

      - name: Security scan
        run: python -m bandit --configfile pyproject.toml -q -ii -lll -r container

      - name: Dead-code scan
        run: python -m vulture

  typecheck-and-tests:
    name: Pyright and Boundary Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: container/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement container/requirements.txt pyright

      - name: Verify dependency compatibility
        run: python -m pip check

      - name: Run Pyright
        run: python -m pyright --warnings

      - name: Install the tools the image installs
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ripgrep

      - name: Run tests
        run: python -m pytest
