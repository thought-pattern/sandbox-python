name: Python Autoformatting

on:
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - ".github/workflows/python-formatting.yml"
  push:
    branches: [develop, main]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - ".github/workflows/python-formatting.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: python-formatting-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format-python:
    name: Format Python
    # GitHub does not grant a write token to fork or Dependabot pull requests.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: container/requirements.txt

      - name: Install formatting tools
        run: python -m pip install --upgrade black isort ruff

      - name: Configure Git
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git fetch -q
          git checkout "$BRANCH" --progress
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only

      - name: Run code formatters
        run: |
          isort container tests
          ruff check --fix --exit-zero container tests
          black -l 132 -t py311 container tests

      - name: Check for changes
        id: git-check
        run: |
          git add -u -- '*.py'
          if git diff --cached --quiet; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git commit -m "Apply Python autoformatting"
          git push
