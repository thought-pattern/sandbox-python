name: Check Pip Conflicts

on:
  pull_request:
    paths:
      - "container/requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/pip-conflicts.yml"
  push:
    branches: [develop, main]
    paths:
      - "container/requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/pip-conflicts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pip-conflicts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-pip-conflicts:
    name: Resolve container/requirements.txt
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-tools
        run: python -m pip install pip-tools

      - name: Check for conflicts
        run: |
          echo "Resolving container/requirements.txt..."
          if pip-compile container/requirements.txt \
              --dry-run \
              --quiet \
              --no-header \
              --strip-extras \
              --output-file=- > resolution.log 2>&1; then
            echo "No conflicts found in container/requirements.txt"
          else
            echo "::error file=container/requirements.txt::Dependency conflicts detected in container/requirements.txt"
            grep -E "ERROR|conflict|ResolutionImpossible|requires|depends on" resolution.log || cat resolution.log
            exit 1
          fi
