version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/container"
    schedule:
      interval: "weekly"
    reviewers:
      - "robinje"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "docker"
    directory: "/container"
    schedule:
      interval: "weekly"
    reviewers:
      - "robinje"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "robinje"
    labels:
      - "dependencies"
      - "github-actions"
