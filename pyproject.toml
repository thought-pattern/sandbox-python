[tool.ruff]
line-length = 132
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "N811", "UP038"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["engram", "tapestry"]

[tool.black]
line-length = 132
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 132
combine_as_imports = true
force_sort_within_sections = true
known_first_party = ["engram", "tapestry"]

[tool.pyright]
include = ["container", "tests"]
extraPaths = ["container", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportImportCycles = "error"

[tool.vulture]
paths = ["container", "tests"]
min_confidence = 65
ignore_names = [
    "cancel_futures",
    "exc_type",
    "exc_value",
    "exception_type",
    "format",
    "prefix",
    "traceback",
    "unused_*",
]

[tool.bandit]
exclude_dirs = ["/.venv/"]
