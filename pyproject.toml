[tool.ruff]
line-length = 132
target-version = "py312"
# Generated protobuf and gRPC modules stay as their generator wrote them.
extend-exclude = ["*_pb2.py", "*_pb2.pyi", "*_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "N811", "UP038"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.black]
line-length = 132
target-version = ["py311"]
force-exclude = '_pb2(_grpc)?\.pyi?$'

[tool.isort]
profile = "black"
line_length = 132
combine_as_imports = true
force_sort_within_sections = true
skip_glob = ["*_pb2.py", "*_pb2.pyi", "*_pb2_grpc.py"]

[tool.pyright]
include = ["container", "tests"]
extraPaths = ["container", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportImportCycles = "error"
# Generated gRPC modules are read for their types, and their generator's own diagnostics are not this repository's.
ignore = ["**/*_pb2.py", "**/*_pb2_grpc.py"]

[tool.vulture]
paths = ["container", "tests"]
exclude = ["*_pb2.py", "*_pb2_grpc.py"]
min_confidence = 65
ignore_names = [
    "cancel_futures",
    "exc_type",
    "exc_value",
    "exception_type",
    "format",
    "prefix",
    "traceback",
    "unused_*",
]

[tool.bandit]
exclude_dirs = ["/.venv/"]
